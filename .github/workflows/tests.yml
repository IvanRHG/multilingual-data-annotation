name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - name: Validate annotations and regenerate report
        run: python scripts/validate_annotations.py --report reports/validation_report.md --csv data/annotations.csv
      - name: Committed report and CSV are up to date
        run: git diff --exit-code
      - run: python -m pytest -q
